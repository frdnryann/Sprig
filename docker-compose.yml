services:
  app:
    build:
      context: .
      dockerfile: ./docker/golang/Dockerfile
    container_name: gofinancial-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-gofinancial_db}
      APP_PORT: 8080
    depends_on:
      - mysql
    networks:
      - gofinancialapp-network

  test:
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-gofinancial_db}
    depends_on:
      - mysql
    networks:
      - gofinancialapp-network
    command: go test ./... -v

  mysql:
    image: mysql:8.4
    container_name: gofinancial-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-gofinancial_db}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:Z
    networks:
      - gofinancialapp-network
    deploy:
      resources:
        limits:
          # Testing Environment (ubah pas udah di deploy)
          cpus: '1.0'
          memory: 2048M

  adminer:
    image: adminer:latest
    container_name: gofinancial-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DEFAULT_USER: ${DB_USERNAME:-root}
      ADMINER_DEFAULT_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      - mysql
    networks:
      - gofinancialapp-network
    deploy:
      resources:
        limits:
          # Testing Environment (ubah pas udah di deploy)
          cpus: '0.1'
          memory: 64M

  migrate:
    image: migrate/migrate
    container_name: gofinancialapp_migration-tools
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    networks:
      - gofinancialapp-network
    depends_on:
      - mysql

volumes:
  dbdata:

networks:
  gofinancialapp-network:
    driver: bridge
